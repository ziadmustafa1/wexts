name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Example generate
        run: pnpm --filter wexts-example-hello-rpc generate

      - name: Example build
        run: pnpm --filter wexts-example-hello-rpc build

      - name: Example vercel-build
        run: pnpm --filter wexts-example-hello-rpc vercel-build

      - name: Doctor
        run: pnpm --filter wexts-example-hello-rpc run doctor

      - name: Security doctor
        run: pnpm --filter wexts-example-hello-rpc run doctor:security

      - name: Example start smoke
        run: |
          PORT=3210 pnpm --filter wexts-example-hello-rpc start &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3210/health >/dev/null; then
              break
            fi
            sleep 1
          done
          WEXTS_SMOKE_URL=http://127.0.0.1:3210 pnpm --filter wexts-example-hello-rpc smoke

      - name: Release artifact check
        run: pnpm release:artifact-check
